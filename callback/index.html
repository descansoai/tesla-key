<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ema Car Assistant</title>
<body style="font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px">
<h2>Tesla authorization received</h2>
<p>Copy this code and paste it into the secure box in Grok Bot chat:</p>
<pre id="c" style="white-space:pre-wrap;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px"></pre>
<button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Copied'" style="padding:10px 16px">Copy code</button>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||('No code. '+(p.get('error')||''));</script>
</body>
